name: partylot-indexer
description: Envio HyperIndex sub-second pipeline for PartyLot on Monad Testnet
networks:
  - id: 10143
    rpc_config:
      url: https://testnet-rpc.monad.xyz
    start_block: 70555033
    contracts:
      - name: PartyRegistry
        abi_file_path: abis/PartyRegistry.json
        address:
          - "0xce58a0cf7b9f80994eaeba0138e1525496090d25"
        handler: src/EventHandlers.ts
        events:
          - event: "PartyCreated(uint256 indexed partyId, address indexed host, string title, address treasury)"
          - event: "MemberJoined(uint256 indexed partyId, address indexed guest, uint256 totalMembers)"
      - name: PartyTreasury
        abi_file_path: abis/PartyTreasury.json
        address:
          - "0x7e92f443c26c36e80a7f7ab8939a915dd9fbd991"
        handler: src/EventHandlers.ts
        events:
          - event: "PartyRegistered(bytes32 indexed partyId, address indexed host)"
          - event: "Deposited(bytes32 indexed partyId, address indexed member, uint256 amount, uint256 newBalance)"
          - event: "RewardDistributed(bytes32 indexed partyId, address indexed recipient, uint256 amount, string role)"
          - event: "ReimbursementClaimed(bytes32 indexed partyId, address indexed member, uint256 amount, string description)"
          - event: "DebtSettled(bytes32 indexed partyId, address indexed debtor, address indexed creditor, uint256 amount)"
          - event: "BalanceRolledOver(bytes32 indexed fromPartyId, bytes32 indexed toPartyId, uint256 amount)"
      - name: SocialGraph
        abi_file_path: abis/SocialGraph.json
        address:
          - "0x11ca2ef9acad94fe83d3269bdeabd2c1b627b3d2"
        handler: src/EventHandlers.ts
        events:
          - event: "CrewCreated(uint256 indexed crewId, string name, address indexed host)"
          - event: "GatheringRecorded(uint256 indexed partyId, uint256 participantsCount)"
          - event: "SocialTiesUpdated(address indexed userA, address indexed userB, uint256 totalShared)"
